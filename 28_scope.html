<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        /*
        변수 scope : 선언한 변수에 대한 접근성(할 수 있는 범위)을 의미한다.
        1. 함수 안에서 선언 => 함수 안에서만 접근 가능
        2. 함수 밖에서 선언하면 함수 안과 밖에서 모두 사용이 가능하다.
        3. 함수 안과 함수 밖은 scope가 달라 let(재할당 가능)이나 const(재할당, 재선언 가능)로 동일한 이름으로 선언해도 사용이 가능하다.
        */

        let myCar = "kia";
        function myFunction() {
            console.log(myCar);
        }
        myFunction();

        function myFunction2() {
            let myCar = "테슬라";
            let myCar2 = "폴스타";
            console.log(myCar);
        }
        myFunction2();
        console.log(myCar2);    //스코프가 함수 안이라 출력 안 됨.

    </script>
</body>

</html>
