    <script>
        /* 개발자들은 왜 일반 객체대신 map을 쓸까요?
           1. 갯수 구하기 쉬움
           2. 자료를 추가하고 삭제하는 속도가 빠름 (내부적 속도 빠름)
           3. key에 무엇이든 올 수 있음
           주로 장바구니.. 에 이용 set보다 map❤️
        */

        /* 실무 예제 : 온라인 쇼핑몰 장바구니 관리
                -쇼핑몰 웹사이트를 만들 때 장바구니는 아래 기능이 반드시 필요합니다.
            1. 상품 담기 (추가)
            2. 이미 담긴 상품인지 확인하고 수량 늘리기(조회 및 수정)
            3. 상품 빼기 (삭제)
            4. 장바구니에 총 몇 종류의 상품이 있는지 확인(개수 파악)
        */

        const myCart = new Map();

        //이미 장바구니에 들어있는 제품 목록
        myCart.set("product_01", { name: "핸드폰", price: 1800000, quantity: 1 });
        myCart.set("product_12", { name: "노트북", price: 3000000, quantity: 1 });
        myCart.set("product_100", { name: "하리보", price: 2000, quantity: 5 });

        //추가로 구매할 상품
        let userInput = "product_12";

        //장바구니에 있는지 확인 / 실행 > myCartCheckAndDo()함수
        //있다면? => 정말 추가할래?(이미잇거등) 예-> quantitiy++
        //아니오-> x
        //없다면? => console.log("추가하였습니다");

        // function myCartCheckAndDo(userInput) {
        //     if (myCart.has(userInput)) {
        //         let answer = prompt("해당 상품이 이미 존재합니다. 정말 추가하시겠습니까? (y/n)");
        //         if (answer === "y") {
        //             myCart.quantity++;
        //         }
        //     } else {
        //         myCart.quantity++;
        //         console.log("추가하였습니다.")
        //     }
        //     console.log("현재 장바구니에 담긴 의 개수 : ")
        // }

        const myCartCheckAndDo = (productId) => {
            if (myCart.has(productId)) {
                alert("이미 있는 상품입니다.");
                if (prompt("이미 장바구니에 있는 상품입니다. 추가하겠습니까?")) {
                    const item = myCart.get(userInput); //키에 해당하는 내용 가져오기
                    item.quantity += 1; //item은 object
                    myCart.set(userInput, item); //키에 해당한는 내용의 갯수 1증가한 값으로 고치기
                    console.log(
                        `현재 장품에 담긴 ${item.name}의 갯수:${item.quantity}`,
                    );
                }
            }
        }

        myCartCheckAndDo(userInput);
        myCartCheckAndDo(userInput);
        myCartCheckAndDo(userInput);

        //과제 : showMyCart- 물건종류, 총갯수, 총가격
