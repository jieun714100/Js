<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 16px;
            text-align: center;
        }

        th,
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #dddddd;
        }

        th {
            background-color: #e998ce;
            color: white;
            font-weight: bold;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <th>학번</th>
            <th>이름</th>
            <th>벌점</th>
        </thead>
        <tbody>
            <tr>
                <td>2317</td>
                <td>홍성재</td>
                <td>5</td>
            </tr>
            <tr>
                <td>2304</td>
                <td>민서연</td>
                <td>1</td>
            </tr>
            <tr>
                <td>2312</td>
                <td>이담현</td>
                <td>2</td>
            </tr>
            <tr>
                <td>2314</td>
                <td>정지은</td>
                <td>0</td>
            </tr>
        </tbody>
    </table>
    <script>
        //자바스크립트에서 가장 많이 사용하며 실무에서 중요도가 높은 객체
        let brands = ["구글", "애플", "아마존", "삼성", "하이닉스", "메타"];

        //1. toString() : 배열요소를 하나의 문자열(,)로 합치기 
        console.log(brands.toString()); //구글,애플,아마존,삼성,하이닉스,메타

        //2. *******join() : 파라미터로 전달된 문자를 이용해서 하나의 문자열로 합치기
        console.log(brands.join("")); //구글애플아마존삼성하이닉스메타
        console.log(brands.join("/")); //구글/애플/아마존/삼성/하이닉스/메타

        //2-1. join()실무 활용 : db에서 데이터를 읽어와 동적으로 표를 만들어 화면에 출력



    </script>
</body>

</html>
