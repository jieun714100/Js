<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            background-color: lightpink;
        }

        th,
        td {
            border: 1px solid rgb(255, 255, 255);
            padding: 5px;
            text-align: center;
        }

        thead {
            background-color: rgb(233, 105, 165);
        }
    </style>
</head>

<body>
    <select id="selDrinkType"></select>
    <select id="selDrinkType2"></select>

    <br>

    <button onclick="doSearch1()">조회1</button>
    <button onclick="doSearch2()">조회2</button>

    <table class="tableEx">
        <thead>
            <tr>
                <th>학번</th>
                <th>이름</th>
                <th>벌점</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2317</td>
                <td>홍성재</td>
                <td>8</td>
            </tr>
            <tr>
                <td>2306</td>
                <td>박주혁</td>
                <td>2</td>
            </tr>
            <tr>
                <td>2305</td>
                <td>민서연</td>
                <td>1</td>
            </tr>
            <tr>
                <td>2312</td>
                <td>이담현</td>
                <td>2</td>
            </tr>
        </tbody>
    </table>

    <br>

    <table class="tableEx">
        <thead>
            <tr>
                <th>음료</th>
                <th>가격</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>
        let brands = ["구글", "애플", "아마존", "삼성", "하이닉스", "메타"];

        // toString()
        console.log(brands.toString());

        // join()
        console.log(brands.join(""));
        console.log(brands.join("/"));

        // 조회1
        const doSearch1 = () => {
            const drinkList = [
                { name: "오렌지", price: 1000 },
                { name: "파워에이드", price: 1200 },
                { name: "커피", price: 700 },
                { name: "보리음료", price: 1200 },
                { name: "코카콜라", price: 1800 },
            ];

            let trTags = "";

            for (let drink of drinkList) {
                trTags += "<tr>";
                trTags += "<td>" + drink.name + "</td>";
                trTags += "<td>" + drink.price + "</td>";
                trTags += "</tr>";
            }

            document.getElementById("tbody").innerHTML = trTags;
        };

        // 조회2
        const doSearch2 = () => {
            const drinkList = [
                { name: "오렌지", price: 1000 },
                { name: "파워에이드", price: 1200 },
                { name: "커피", price: 700 },
                { name: "보리음료", price: 1200 },
                { name: "코카콜라", price: 1800 },
            ];

            let trTags = [];

            for (let drink of drinkList) {
                let row =
                    "<tr>" +
                    "<td>" + drink.name + "</td>" +
                    "<td>" + drink.price + "</td>" +
                    "</tr>";

                trTags.push(row);
            }

            document.getElementById("tbody").innerHTML = trTags.join("");
        };

        // pop()
        brands = ["구글", "애플", "아마존", "삼성", "하이닉스", "메타"];
        console.log(brands.pop());
        console.log(brands);

        // push()
        console.log(brands.push("테슬라"));
        console.log(brands);

        // shift()
        console.log(brands.shift());
        console.log(brands);

        // unshift()
        console.log(brands.unshift("쿠팡"));
        console.log(brands);

        // select 1
        const loadDrinkType = () => {
            const drinks = [
                { text: "이온음료", code: "ion" },
                { text: "커피", code: "coffee" },
                { text: "라떼", code: "latte" },
            ];

            drinks.unshift({ text: "전체", code: "all" });

            let tags = [];

            for (let drink of drinks) {
                tags.push(
                    "<option value='" +
                    drink.code +
                    "'>" +
                    drink.text +
                    "</option>"
                );
            }

            return tags;
        };

        document.getElementById("selDrinkType").innerHTML =
            loadDrinkType().join("");

        // select 2
        const loadDrinkType2 = (plus) => {
            const drinks = [
                { text: "이온음료", code: "ion" },
                { text: "커피", code: "coffee" },
                { text: "라떼", code: "latte" },
            ];

            let tags = [];

            for (let drink of drinks) {
                tags.push(
                    "<option value='" +
                    drink.code +
                    "'>" +
                    drink.text +
                    "</option>"
                );
            }

            if (plus) {
                tags.unshift(
                    "<option value='" +
                    plus.code +
                    "'>" +
                    plus.text +
                    "</option>"
                );
            }

            return tags;
        };

        const selDrink2 = loadDrinkType2({
            text: "전체",
            code: "all"
        });

        document.getElementById("selDrinkType2").innerHTML =
            selDrink2.join("");

        //7. splice(p1, p2, p3) : 원하는 위치에 특정 요소를 추가하거나 제거
        //p1 : 원하는 위치
        //p2 : 삭제할 갯수
        //p3 : 추가할 요소
        //원 배열은 변할까? : yes
        // splice()
        brands = ["구글", "애플", "아마존", "삼성", "하이닉스", "메타"];
        console.log("여기");

        console.log(brands.splice(1, 0, "테슬라")); // []
        console.log(brands); //['구글', '테슬라', '애플', '아마존', '삼성', '하이닉스', '메타']

        console.log(brands.splice(brands.indexOf("애플"), 0, "아마존"))
        console.log(brands); //['구글', '테슬라', '아마존', '애플', '아마존', '삼성', '하이닉스', '메타']

        //8. concat() : 배열을 합치기 (갯수 제한 없음)
        let arr1 = ["공은성", "김세주"]
        let arr2 = ["최명준", "홍성재"]
        let arr3 = ["신수아", "윤지온"]
        let arr4 = arr1.concat(arr2);
        console.log(arr4)//['공은성', '김세주', '최명준', '홍성재']
        let arr5 = arr1.concat(arr2, arr3);
        console.log(arr5)//['공은성', '김세주', '최명준', '홍성재', '신수아', '윤지온']

        //*****spread operator(전개 연산자)*****
        let arr6 = [...arr1, ...arr2, ...arr3];
        console.log(arr6)//['공은성', '김세주', '최명준', '홍성재', '신수아', '윤지온']

        //9. slice(start, end) : end-1 까지 잘라내기 => 배열로 리턴
        console.log(brands);//['구글', '테슬라', '아마존', '애플', '아마존', '삼성', '하이닉스', '메타']
        const newBrands = brands.slice(0, 4);
        console.log(newBrands);//['구글', '테슬라', '아마존', '애플']
        console.log(brands);//['구글', '테슬라', '아마존', '애플', '아마존', '삼성', '하이닉스', '메타']

        //10. *************************sort()***********************
        /* - 문자열 오름차순이 기본
        자바스크립트의 비교함수의 동작원리 => 엔진이 내부적으로 알고리즘
        (크롬의 경우 TimSort알고리즘)을 갖고 있으며 함수를 매개변수로 사용한다.

        반환값에 따라 다음과 같이 동작한다.

        const결과배열 = 대상배열.sort((a, b)=>{
        if( a > b) return 1; //양수이면 자리를 바꾼다
        else if (a < b) return -1; //음수이면 자리를 바꾸지 않는다
        else 0; //순서를 바꾸지 않는다
        });

        */
        console.log(brands.sort())//['구글', '메타', '삼성', '아마존', '아마존', '애플', '테슬라', '하이닉스']
        console.log(arr5.sort())//['공은성', '김세주', '신수아', '윤지온', '최명준', '홍성재']

        let points = [100, 98, 89, 95, 76, 64];
        console.log(points.sort()) //[100, 64, 76, 89, 95, 98] -> 문자열로 인식

        const newPoints = points.sort((a, b) => {
            if (a > b) return 1; //양수이면 자리를 바꾼다
            else if (a < b) return -1; //음수이면 자리를 바꾸지 않는다
            else 0; //순서를 바꾸지 않는다
        });
        console.log(newPoints)//[64, 76, 89, 95, 98, 100]

        const asc = points.sort((a, b) => {
            if (a > b) return -1;
            else if (a < b) return 1;
            else 0;
        });
        console.log(asc) //[100, 98, 95, 89, 76, 64]

        const sasc = points.sort((a, b) => {
            return b - a;
        });
        console.log(asc) //[100, 98, 95, 89, 76, 64]

        const spoint = points.sort((a, b) => {
            return a - b;
        });
        console.log(asc) //[64, 76, 89, 95, 98, 100]



        const drinkList = [
            { name: "오렌지", price: 1000 },
            { name: "파워에이드", price: 1200 },
            { name: "커피", price: 700 },
            { name: "보리음료", price: 1200 },
            { name: "코카콜라", price: 1800 },
        ];
        //1. 가격 오름차순 정렬
        //2. 이름 내림차순 정렬
        //3. 키(기준)이름을 입력받아 오름차순 정렬

        // const priceArr = drinkList.sort((a, b) => {
        //     return a.price - b.price;
        // });
        // console.log(priceArr);
        /*{ name: '커피', price: 700 }
        { name: '오렌지', price: 1000 }
        { name: '파워에이드', price: 1200 }
        { name: '보리음료', price: 1200 }
        { name: '코카콜라', price: 1800 }*/

        const nameArr = drinkList.sort((a, b) => {
            if (a.name > b.name) return -1;
            else if (a.name < b.name) return 1;
            else 0;
        });
        console.log(nameArr);
        /*{ name: '파워에이드', price: 1200 }
        { name: '코카콜라', price: 1800 }
        { name: '커피', price: 700 }
        { name: '오렌지', price: 1000 }
        { name: '보리음료', price: 1200 }*/

    </script>
</body>

</html>
