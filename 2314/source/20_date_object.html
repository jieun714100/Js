<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <input type="date" name="" id="startDate" />
    <input type="date" name="" id="endDate" />
    <script>
        //1. 오늘 날짜정보 얻어오기 (매개변수 없이)
        let now = new Date();
        console.log(now) //Fri Jun 19 2026 09:08:30 GMT+0900 (한국 표준시)

        //2. 사용자가 날짜를 지정해서 날짜 객체 만들기
        let d = new Date(2025, 4, 29, 19, 34, 20, 0); // 년 월 일 시 분 초 밀리초
        console.log(d); //Thu May 29 2025 19:34:20 GMT+0900 (한국 표준시)
        // 월 : 1월 - 0  
        // 요일 (일요일 - 0)


        //get()함수 : now
        //데이터 타입 : number =>toString
        let year = now.getFullYear();
        let month = now.getMonth();
        let date = now.getDate();
        let dayName = now.getDay();
        let hour = now.getHours();
        let minute = now.getMinutes();
        let second = now.getSeconds();
        let millisec = now.getMilliseconds();
        let dayNameArr = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];

        console.log(year, month + 1, date, dayNameArr[dayName], hour, minute, second, millisec); //026 6 26 '금요일' 8 44 14 430


        //4. set()함수 => 실무 사용 거의 x

        //5. '2026-06-24'으로 id="endDate"에 출력해보기 => padStart()활용, 위에서 구한 변수 활용
        let today =
            year.toString() +
            "-" +
            (month + 1).toString().padStart(2, "0") +
            "-" +
            date.toString().padStart(2, "0");

        document.getElementById("endDate").value = today;

        //6. 오늘을 기준으로 1주일  전을 id="startDate"에 출력해보기
        //*******************************************************************************
        /* 기준시 : 1977,1,1,0,0,0  => 밀리초로 모든 날짜를 계산하는 방식
         - 밀리초를 구하는 내장함수 : getTime();
         - 밀리초로 날짜를 구하는 내장함수 : Date(밀리초);

        */
        let standard = new Date(0); //Thu Jan 01 1970 09:00:00 GMT+0900 (한국 표준시)
        console.log(standard);

        let todayMilliSec = now.getTime();
        console.log(todayMilliSec); //1782430912213

        let dayMilliSec = 24 * 60 * 60 * 1000;
        console.log(dayMilliSec)//86400000 (하루 밀리초)

        let yesterDay = new Date(todayMilliSec - dayMilliSec)
        console.log(yesterDay)//Tue Jun 23 2026 12:02:01 GMT+0900 (한국 표준시)


        //6. 오늘을 기준으로 1주일 전을 id="startDate"에 출력해보기
        // 오늘 기준 1주일 전
        let lastWeek = new Date(todayMilliSec - (dayMilliSec * 7));
        console.log(lastWeek)//Fri Jun 19 2026 08:47:12 GMT+0900 (한국 표준시) -> 저번주
        year = lastWeek.getFullYear();
        month = lastWeek.getMonth();
        date = lastWeek.getDate();

        lastWeek =
            year.toString() +
            "-" +
            (month + 1).toString().padStart(2, "0") +
            "-" +
            date.toString().padStart(2, "0");

        document.getElementById("startDate").value = lastWeek; //startdate부분에 6-19 가 뜬다


        //7. 오늘 기준으로 며칠 전(-n) 후(n)를 구하는 함수 : getIntervalDate()
        const getIntervalDate = ((day) => {
            let today = new Date();
            let dayMilliSec = 24 * 60 * 60 * 1000;//하루 밀리초
            let intervalDay = today.getTime() + day * dayMilliSec;
            return new Date(intervalDay);
        });

        console.log(`3일전 : ${getIntervalDate(-3)}`) //3일 전 : 6/23
        console.log(`3일전 : ${getIntervalDate(-7)}`) //7일 전 : 6/19
        console.log(`3일전 : ${getIntervalDate(30)}`) //30일 후 : 5/25
        console.log(`3일전 : ${getIntervalDate(3)}`) //3일 후 : 6/29
        console.log(getIntervalDate(3))



        //8. 내가 원하는 포맷으로 오늘 기준으로 며칠 전(-n) 후(n)를 구하는 함수
        const getIntervalDateFormat = (day, format) => {
            let today = new Date();
            let dayMilliSec = 24 * 60 * 60 * 1000;//하루 밀리초
            let intervalDay = today.getTime() + day * dayMilliSec;
            let d = new Date(intervalDay);

            let year8 = d.getFullYear();
            let month8 = d.getMonth();
            let date8 = d.getDate();

            let calender =
                year8.toString() + "-"
                + (month8 + 1).toString().padStart(2, "0") + "-"
                + date8.toString().padStart(2, "0");

            if (format.length === 10) {
                return calender;
            } else if (format.length === 8) {
                return calender.slice(2)
            }

        };

        console.log(getIntervalDateFormat(-3, "YYYY-MM-DD")); //2026-06-28
        console.log(getIntervalDateFormat(3, "YY-MM-DD")); //26-07-04


        //9. 내가 원하는 구분자로 오늘 기준으로 며칠 전(-n) 후(n)를 구하는 함수
        //10. 

    </script>

</body>

</html>
