<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <input type="date" name="" id="startDate" />
    <input type="date" name="" id="endDate" />
    <script>
        //1. 오늘 날짜정보 얻어오기 (매개변수 없이)
        let now = new Date();
        console.log(now) //Fri Jun 19 2026 09:08:30 GMT+0900 (한국 표준시)

        //2. 사용자가 날짜를 지정해서 날짜 객체 만들기
        let d = new Date(2025, 4, 29, 19, 34, 20, 0); // 년 월 일 시 분 초 밀리초
        console.log(d); //Thu May 29 2025 19:34:20 GMT+0900 (한국 표준시)
        // 월 : 1월 - 0  
        // 요일 (일요일 - 0)


        //get()함수 : now
        let year = now.getFullYear();
        let month = now.getMonth();
        let date = now.getDate();
        let dayName = now.getDay();
        let hour = now.getHours();
        let minute = now.getMinutes();
        let second = now.getSeconds();
        let millisec = now.getMilliseconds();

        console.log(year, month, date, dayName, hour, minute, second, millisec);


        //4. set()함수 => 실무 사용 거의 x

        //5. '2026-06-24'으로 id="endDate"에 출력해보기 => padStart()활용, 위에서 구한 변수 활용
        let today =
            year.toString() +
            "-" +
            (month + 1).toString().padStart(2, "0") +
            "-" +
            date.toString().padStart(2, "0");

        document.getElementById("endDate").value = today;

        //6. 오늘을 기준으로 1주일  전을 id="startDate"에 출력해보기
        //*******************************************************************************
        /* 기준시 : 1977,1,1,0,0,0  => 밀리초로 모든 날짜를 계산하는 방식
         - 밀리초를 구하는 내장함수 : getTime();
         - 밀리초로 날짜를 구하는 내장함수 : Date(밀리초);

        */
        let standard = new Date(0); //Thu Jan 01 1970 09:00:00 GMT+0900 (한국 표준시)
        console.log(standard);

        let todayMilliSec = now.getTime();
        console.log(todayMilliSec);

        let dayMilliSec = 24 * 60 * 60 * 1000;
        console.log(dayMilliSec)//86400000 (하루 밀리초)

        let yesterDay = new Date(todayMilliSec - dayMilliSec)
        console.log(yesterDay)//Tue Jun 23 2026 12:02:01 GMT+0900 (한국 표준시)


        //6. 오늘을 기준으로 1주일 전을 id="startDate"에 출력해보기
        // 오늘 기준 1주일 전
        let lastWeek = new Date(todayMilliSec - (dayMilliSec * 7));

        document.getElementById("startDate").value =
        lastWeek.toISOString().split("T")[0];

        //오늘 기준으로 며칠 전후를 구하는 함수 : getIntervalDate()
        


    </script>

</body>

</html>
