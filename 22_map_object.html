<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //객체와 다른 점
        let oPerson = {};
        oPerson.name = "공은성";
        oPerson.phone = "010-1223-3756";
        oPerson["185"] = 70;

        //객체의 키와 값, 사이즈 출력
        let count = 0;
        for (const key in oPerson) {
            console.log(`${key} : ${oPerson[key]}`);
            count++;
        }//185 : 70
        //name : 공은성
        //phone : 010-1223-3756
        console.log(`사이즈 : ${count}개`); //사이즈 : 3개

        //1. 생성
        let personMap = new Map();
        personMap = new Map();
        personMap.set("name", "공은성");
        personMap.set("phone", "010-1223-3756");
        personMap.set(185, 70);

        //2. 출력 => forEach => (값, 키) : 순서보장
        personMap.forEach((value, key) => {
            console.log(`${key} : ${value}`);
        });
        //name : 공은성
        //phone : 010-1223-3756
        //185 : 70

        //3. size 속성
        console.log(`${personMap.size}개`)

        //4. keys(): key만 읽어오기
        for (const key of personMap.keys()) {
            console.log(key)
        }
        //name
        //phone
        //185

        //5. values() : value만 읽어오기
        for (const value of personMap.values()) {
            console.log(value)
        }
        //공은성
        //010-1223-3756
        //70

        //6. get() : 특정 키의 값을 읽어오기
        console.log(personMap.get("name")) //공은성
        console.log(personMap.get("address")) //undefined

        //⭐7. has() : 해당 키가 존재하는지 여부 boolean(true/false)
        if (personMap.has("name")) {
            //alert("해당키가 존재합니다") //경고창에 "해당키가 존재합니다" 메시지 출력
        }

        //8. delete() : 해당 키와 값을 삭제 
        personMap.delete(185); //삭제
        console.log(personMap.has(185)) //false

        //9. clear() : 전체 삭제
        personMap.clear();
        console.log(personMap.size) //0 -> 다 삭제했기 때문에 0! 메모리 해제는 x, 메모리 이름공간은 남아있듀

    </script>
</body>

</html>
